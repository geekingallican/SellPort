stages:
  - test
  - build_and_publish
  - deploy

.uv-venv:
  before_script:
    - python -m venv .venv && source .venv/bin/activate && pip install uv

lint:
  stage: test
  script:
    - cd frontend && npm run lint
  allow_failure: true

test-api:
  stage: test
  extends:
    - .uv-venv
  script:
    - cd backend && uv sync --group dev && uv run pytest -q
  
build:
  stage: build_and_publish
  script:
    - docker compose build
  after_script:
    - docker tag sellport-backend-1 suhofruct1k/sellport-backend:$CI_COMMIT_SHORT_SHA
    - docker tag sellport-frontend-1 suhofruct1k/sellport-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag sellport-backend-1 suhofruct1k/sellport-backend:latest
    - docker tag sellport-frontend-1 suhofruct1k/sellport-frontend:latest

publish:
  stage: build_and_publish
  before_script:
    - docker login -u $DOCKER_LOGIN -p $DOCKER_PASSWORD
  script:
    - docker push suhofruct1k/sellport-backend:$CI_COMMIT_SHORT_SHA
    - docker push suhofruct1k/sellport-frontend:$CI_COMMIT_SHORT_SHA
    - docker push suhofruct1k/sellport-backend:latest
    - docker push suhofruct1k/sellport-frontend:latest

  

