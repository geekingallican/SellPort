stages:
  - test
  - build_and_publish
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# .test-rules:
#   rules:
#     - changes:
#       - "**/*.py"
#       - "**/*.json"
#       when: on_success
#     - when: never

.uv-venv:
  before_script:
    - python3 -m venv .venv && source .venv/bin/activate && pip install uv

lint:
  stage: test
  script:
    - npm install -g npm@latest
    - cd frontend
    - npm ci
    - npm run lint
  allow_failure: true
#  extends: .test-rules

test-api:
  stage: test
  extends:
    - .uv-venv
#    - .test-rules
  script:
    - cd backend && uv sync --group dev && uv run pytest -q
  needs: []
  
build:
  stage: build_and_publish
  script:
    - docker compose build
  after_script:
    - docker tag sellport-backend suhofruct1k/sellport-backend:$CI_COMMIT_SHORT_SHA
    - docker tag sellport-frontend suhofruct1k/sellport-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag sellport-backend suhofruct1k/sellport-backend:latest
    - docker tag sellport-frontend suhofruct1k/sellport-frontend:latest

publish:
  stage: build_and_publish
  before_script:
    - docker login -u $DOCKER_LOGIN -p $DOCKER_PASSWORD
  script:
    - docker push suhofruct1k/sellport-backend:$CI_COMMIT_SHORT_SHA
    - docker push suhofruct1k/sellport-frontend:$CI_COMMIT_SHORT_SHA
    - docker push suhofruct1k/sellport-backend:latest
    - docker push suhofruct1k/sellport-frontend:latest
  needs: [build]
deploy:
  stage: deploy
  script:
    - cp $ENV_BACKEND backend/.env
    - git pull https://gitlab.com/northwaykraston/SellPort && docker compose up --build -d
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true


  

