services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
  postgres:
    image: postgres:alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "$$POSTGRES_USER"]
      interval: 10s
      timeout: 7s
      retries: 3
      start_period: 20s
    env_file: ./backend/.env
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - URL=northway67.duckdns.org
      - SUBDOMAINS=wildcard
      - VALIDATION=duckdns
      - DUCKDNSTOKEN=17c49571-4c53-4123-a90e-f362f9bc8b83
    volumes:
      - /opt/sellport/swag-config:/config
    ports:
      - 443:443
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on: 
      - backend
  redis:
    image: redis:alpine
    restart: always
    env_file: ./backend/.env
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --protected-mode no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 3s
      retries: 3
      start_period: 10s
      timeout: 5s
  rustfs:
    image: rustfs/rustfs
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:9000/health/live || curl -f http://localhost:9000/health/live || exit 1"]
      interval: 5s
      retries: 3
      start_period: 10s
      timeout: 5s
volumes:
  pgdata:
  redisdata:
  rustfs_data:
