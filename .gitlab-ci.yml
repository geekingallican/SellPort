stages:
  - test
  - build_and_publish
  - deploy

include:
  - template: Jobs/SAST.gitlab-ci.yml
  
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

